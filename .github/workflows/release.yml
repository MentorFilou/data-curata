name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

# all permissions are declared explicitly per job
permissions: {}

jobs:
  release:
    # only run when the PR was actually merged (not just closed/abandoned)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # write access required to push the version bump commit, tag, and release
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # fetch full history so the push doesn't lose commits made since the merge
          fetch-depth: 0
          # GITHUB_TOKEN is used here; if main has branch-protection rules that
          # require PRs, replace with a PAT stored in secrets.RELEASE_TOKEN
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump type from PR label
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"patch"'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Merged PR has no patch/minor/major label — skipping release."
            echo "type=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package.json version
        if: steps.bump.outputs.type != 'skip'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # --no-git-tag-version: only edits package.json, no commit/tag yet
          npm version ${{ steps.bump.outputs.type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        if: steps.bump.outputs.type != 'skip'
        run: |
          git add package.json
          git commit -m "chore: release v${{ steps.version.outputs.new_version }}"
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.bump.outputs.type != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.new_version }}" \
            --title "v${{ steps.version.outputs.new_version }}" \
            --generate-notes \
            --verify-tag
